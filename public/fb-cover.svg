<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 465" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="465" fill="#0F172A" />

  <!-- Ambient Glow Shapes -->
  <circle cx="1000" cy="100" r="300" fill="#10B981" opacity="0.15" filter="blur(60px)" />
  <circle cx="200" cy="350" r="250" fill="#F59E0B" opacity="0.1" filter="blur(60px)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 150)">
    <path d="M0 80 C40 120, 120 120, 160 80" fill="none" stroke="url(#coverGrad)" stroke-width="8" opacity="0.5" />
    <path d="M10 20 L50 100 L80 40 L110 100 L150 20" fill="none" stroke="url(#coverGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="80" cy="0" r="10" fill="#F59E0B" />
  </g>

  <!-- Text & Copy -->
  <text x="300" y="200" font-family="-apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">
    Wander<tspan fill="#10B981">Link</tspan> <tspan font-size="32" font-weight="500" fill="#94A3B8">Travel</tspan>
  </text>
  
  <text x="300" y="250" font-family="-apple-system, sans-serif" font-weight="600" font-size="24" fill="#38BDF8">
    Precision Travel Matching Powered by AI
  </text>

  <text x="300" y="290" font-family="-apple-system, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">
    Discover your bespoke Travel DNA in 2 minutes • Tailored Escapes &amp; Live Bookings
  </text>

  <!-- Call to Action Badge -->
  <rect x="300" y="325" width="280" height="48" rx="12" fill="url(#coverGrad)" />
  <text x="440" y="356" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A" text-anchor="middle">
    wanderlinktravel.com ✈️
  </text>
</svg>

